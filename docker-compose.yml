services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-video-summary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: video_summary
      POSTGRES_USER: video_summary
      POSTGRES_PASSWORD: video_summary_dev
    ports:
      - "5432:5432"
    volumes:
      - video_summary_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_summary -d video_summary"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://video_summary:video_summary_dev@postgres:5432/video_summary
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  video_summary_pgdata:

